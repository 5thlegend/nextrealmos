name: Build NROS for Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to push the built artifacts and the build log to separate branches

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Stub values for build — real values get injected at request time on Cloudflare.
      NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-replace-me
      NEXT_PUBLIC_APP_URL: https://nextrealmos.pages.dev
      SUPABASE_SERVICE_ROLE_KEY: stub-replace-me
      ANTHROPIC_API_KEY: stub-replace-me
      OPENAI_API_KEY: stub-replace-me
      NROS_AI_DEFAULT_PROVIDER: anthropic
      NROS_AI_DEFAULT_MODEL: claude-opus-4-7

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for orphan branch push

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        id: install
        run: npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tee /tmp/install.log

      - name: Build for Cloudflare Pages
        id: build
        continue-on-error: true
        run: |
          set +e
          npx @cloudflare/next-on-pages@1 2>&1 | tee /tmp/build.log
          echo "build_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          true

      - name: Snapshot output dir
        if: always()
        run: |
          {
            echo "=== build_exit=${{ steps.build.outputs.build_exit }} ==="
            echo "=== node version ==="; node --version
            echo "=== top-level files ==="
            ls -la
            echo "=== .vercel/output (if exists) ==="
            ls -la .vercel/output 2>&1 || echo "not present"
            echo "=== .vercel/output/static (if exists) ==="
            ls -la .vercel/output/static 2>&1 | head -50 || echo "not present"
            echo "=== .next (if exists) ==="
            ls -la .next 2>&1 | head -30 || echo "not present"
          } > /tmp/snapshot.log 2>&1

      - name: Publish diagnostics to `build-log` branch (always)
        if: always()
        run: |
          set -e
          git config user.name  "nros-builder"
          git config user.email "builder@nextrealm.io"

          # collect all diagnostics into a flat dir
          mkdir -p /tmp/diag
          cp /tmp/install.log  /tmp/diag/install.log  2>/dev/null || true
          cp /tmp/build.log    /tmp/diag/build.log    2>/dev/null || true
          cp /tmp/snapshot.log /tmp/diag/snapshot.log 2>/dev/null || true
          echo "run=${{ github.run_id }}"        >  /tmp/diag/_meta
          echo "sha=${{ github.sha }}"           >> /tmp/diag/_meta
          echo "exit=${{ steps.build.outputs.build_exit }}" >> /tmp/diag/_meta
          echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/diag/_meta

          # orphan + force-push
          git checkout --orphan build-log
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r /tmp/diag/. ./
          git add -A
          git commit -m "build-log run=${{ github.run_id }} sha=${{ github.sha }} exit=${{ steps.build.outputs.build_exit }}"
          git push origin build-log --force

      - name: Fail the job if build failed
        if: always() && steps.build.outputs.build_exit != '0'
        run: |
          echo "Build failed with exit ${{ steps.build.outputs.build_exit }} — see build-log branch for full output."
          exit 1

      - name: Publish built output to `built-output` branch
        if: steps.build.outputs.build_exit == '0'
        run: |
          set -e
          git fetch origin
          git checkout main -- .  || true

          mkdir -p /tmp/built
          cp -r .vercel/output/static/. /tmp/built/

          git checkout --orphan built-output
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r /tmp/built/. ./
          touch .nojekyll
          echo "built sha=${{ github.sha }} ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .build-info
          git add -A
          git commit -m "build: ${{ github.sha }}"
          git push origin built-output --force

      - name: Upload build artifact (backup access)
        if: steps.build.outputs.build_exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-build
          path: .vercel/output/static
          retention-days: 7
