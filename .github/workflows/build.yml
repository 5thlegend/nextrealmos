name: Build NROS for Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to push the built artifacts and the build log to separate branches

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # NEXT_PUBLIC_* values are inlined into client bundles at build time and are
      # public-by-design (the anon key is intended to be exposed to browsers).
      # Real Supabase project: pwmmoqoayhjonwhombbz
      NEXT_PUBLIC_SUPABASE_URL: https://pwmmoqoayhjonwhombbz.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3bW1vcW9heWhqb253aG9tYmJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NDgzMzksImV4cCI6MjA5NDEyNDMzOX0.qWtlUNAYTOLe0DphULt3ZZqfibdySWsBNLoCEVNSqe4
      NEXT_PUBLIC_APP_URL: https://nextrealmos.pages.dev

      # Server-only — stub values OK for build (only accessed at request time on CF).
      # Real values are PATCHed onto the CF Pages project's runtime env vars.
      SUPABASE_SERVICE_ROLE_KEY: stub-replace-me
      ANTHROPIC_API_KEY: stub-replace-me
      OPENAI_API_KEY: stub-replace-me
      NROS_AI_DEFAULT_PROVIDER: cloudflare
      NROS_AI_DEFAULT_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tee /tmp/install.log

      - name: Build for Cloudflare Pages
        id: build
        continue-on-error: true
        run: |
          set +e
          npx @cloudflare/next-on-pages@1 2>&1 | tee /tmp/build.log
          echo "build_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          true

      # Stash the built output BEFORE we destroy the working tree
      - name: Stash build output + snapshot
        if: always()
        run: |
          {
            echo "=== build_exit=${{ steps.build.outputs.build_exit }} ==="
            echo "=== node $(node --version) ==="
            echo "=== top-level files ==="; ls -la
            echo "=== .vercel/output ==="; ls -la .vercel/output 2>&1 || echo "not present"
            echo "=== .vercel/output/static ==="; ls -la .vercel/output/static 2>&1 | head -50 || echo "not present"
          } > /tmp/snapshot.log 2>&1

          if [ -d .vercel/output/static ]; then
            mkdir -p /tmp/built
            cp -r .vercel/output/static/. /tmp/built/
            echo "stashed $(du -sh /tmp/built | cut -f1) of build output to /tmp/built"
          fi

      - name: Publish built output to `built-output` branch
        if: steps.build.outputs.build_exit == '0'
        run: |
          set -e
          git config user.name  "nros-builder"
          git config user.email "builder@nextrealm.io"

          git checkout --orphan built-output
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r /tmp/built/. ./
          touch .nojekyll
          echo "built sha=${{ github.sha }} ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .build-info
          git add -A
          git commit -m "build: ${{ github.sha }}"
          git push origin built-output --force

      - name: Publish diagnostics to `build-log` branch (always)
        if: always()
        run: |
          set -e
          git config user.name  "nros-builder"
          git config user.email "builder@nextrealm.io"

          mkdir -p /tmp/diag
          cp /tmp/install.log  /tmp/diag/install.log  2>/dev/null || true
          cp /tmp/build.log    /tmp/diag/build.log    2>/dev/null || true
          cp /tmp/snapshot.log /tmp/diag/snapshot.log 2>/dev/null || true
          {
            echo "run=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "exit=${{ steps.build.outputs.build_exit }}"
            echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > /tmp/diag/_meta

          git checkout --orphan build-log-tmp
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r /tmp/diag/. ./
          git add -A
          git commit -m "build-log run=${{ github.run_id }} sha=${{ github.sha }} exit=${{ steps.build.outputs.build_exit }}"
          git push origin build-log-tmp:build-log --force

      - name: Upload build artifact (backup access)
        if: steps.build.outputs.build_exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-build
          path: /tmp/built
          retention-days: 7

      - name: Fail the job if build failed
        if: steps.build.outputs.build_exit != '0'
        run: |
          echo "Build failed with exit ${{ steps.build.outputs.build_exit }} — see build-log branch."
          exit 1
